<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Chord AI — Audio Test</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #07090d;
  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding: 24px;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

h1 {
  margin-bottom: 6px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  color: #8d96a5;
  margin-top: 0;
  margin-bottom: 30px;
}

.card {
  background: #10141b;

  border:
    1px solid #252c37;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 20px;
}

input[type="file"] {
  width: 100%;
  margin-bottom: 18px;
}

button {
  width: 100%;

  border: 0;

  border-radius: 14px;

  padding: 16px;

  font-size: 16px;
  font-weight: 700;

  background: #3578ff;
  color: white;

  cursor: pointer;

  transition:
    opacity .2s ease,
    transform .15s ease,
    background .2s ease;
}

button:active {
  transform: scale(.985);
}

button:disabled {
  opacity: .45;
  cursor: default;
}

.button-secondary {
  background: #1a2230;

  border:
    1px solid #303a49;
}

.copy-actions {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 10px;

  margin-bottom: 16px;
}

.copy-actions button {
  padding: 13px 10px;

  border-radius: 12px;

  font-size: 14px;
}

.copy-feedback {
  min-height: 18px;

  margin-top: -6px;
  margin-bottom: 12px;

  color: #6be89b;

  font-size: 13px;
  font-weight: 600;
}

.status {
  margin-top: 18px;
  color: #aab2c0;
}

.error {
  color: #ff6767;
}

.success {
  color: #6be89b;
}

.chord {
  padding: 14px 0;

  border-bottom:
    1px solid #242a34;
}

.chord:last-child {
  border-bottom: 0;
}

.chord-name {
  font-size: 22px;
  font-weight: 800;
}

.time {
  color: #8993a3;
  margin-top: 4px;
}

.confidence {
  color: #657083;
  font-size: 13px;
  margin-top: 4px;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;

  font-size: 12px;
  line-height: 1.45;

  color: #9ca6b7;

  max-height: 520px;

  overflow-y: auto;

  margin-bottom: 0;

  padding-right: 4px;
}

@media (max-width: 520px) {

  body {
    padding: 16px;
  }

  .card {
    padding: 17px;
  }

  .copy-actions {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<div class="container">

  <h1>Chord AI</h1>

  <p class="subtitle">
    Teste do Audio Engine
  </p>


  <div class="card">

    <input
      id="file"
      type="file"
      accept=".wav,audio/wav,audio/x-wav"
    >

    <button id="analyze">
      Analisar WAV
    </button>

    <div
      id="status"
      class="status"
    >
      Selecione um arquivo WAV.
    </div>

  </div>


  <div
    id="result"
    class="card"
    style="display:none"
  >

    <h2>Resultado</h2>

    <div id="audioInfo"></div>

    <div id="chords"></div>

  </div>


  <div
    id="debugCard"
    class="card"
    style="display:none"
  >

    <h2>Resposta da API</h2>

    <div class="copy-actions">

      <button
        id="copyFull"
        class="button-secondary"
        type="button"
      >
        Copiar API completa
      </button>

      <button
        id="copyDiagnostic"
        class="button-secondary"
        type="button"
      >
        Copiar diagnóstico
      </button>

    </div>

    <div
      id="copyFeedback"
      class="copy-feedback"
    ></div>

    <pre id="debug"></pre>

  </div>

</div>


<script>

const API =
  "https://chord-ai-api.onrender.com";


const fileInput =
  document.getElementById("file");

const button =
  document.getElementById("analyze");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const audioInfo =
  document.getElementById("audioInfo");

const chordsContainer =
  document.getElementById("chords");

const debugCard =
  document.getElementById("debugCard");

const debug =
  document.getElementById("debug");

const copyFullButton =
  document.getElementById("copyFull");

const copyDiagnosticButton =
  document.getElementById(
    "copyDiagnostic"
  );

const copyFeedback =
  document.getElementById(
    "copyFeedback"
  );


/* =========================================
   ÚLTIMA RESPOSTA DA API
========================================= */

let lastApiResponse =
  null;


/* =========================================
   COPIAR TEXTO

   Usa Clipboard API quando disponível.

   Tem fallback para navegadores/mobile
   que não permitem navigator.clipboard.
========================================= */

async function copyText(
  text
){

  if(
    navigator.clipboard
    &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(
      text
    );

    return;

  }


  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";

  textarea.style.top =
    "0";


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();


  const copied =
    document.execCommand(
      "copy"
    );


  document.body.removeChild(
    textarea
  );


  if(!copied){

    throw new Error(
      "Não foi possível copiar."
    );

  }

}


/* =========================================
   FEEDBACK DO BOTÃO
========================================= */

function showCopyFeedback(
  message
){

  copyFeedback.textContent =
    message;


  clearTimeout(
    showCopyFeedback.timer
  );


  showCopyFeedback.timer =
    setTimeout(
      () => {

        copyFeedback.textContent =
          "";

      },
      2200
    );

}


/* =========================================
   DIAGNÓSTICO COMPACTO

   Copia somente o que realmente interessa
   para analisar decisões do Validator.
========================================= */

function buildDiagnosticCopy(
  data
){

  if(
    !data
    ||
    !Array.isArray(
      data.chords
    )
  ){

    return JSON.stringify(
      data,
      null,
      2
    );

  }


  const diagnostic = {

    engine:
      data.engine
      ??
      null,

    audioEngine:
      data.audioEngine
      ??
      null,

    chordEngine:
      data.chordEngine
      ??
      null,

    reconstructionValidator:
      data.reconstructionValidator
      ??
      null,

    audio:
      data.audio
      ??
      null,

    rawChordCount:
      data.rawChordCount
      ??
      null,

    validatedChordCount:
      data.validatedChordCount
      ??
      null,

    chordCount:
      data.chordCount
      ??
      null,

    chords:
      data.chords.map(
        chord => ({

          start:
            chord.start,

          end:
            chord.end,

          chord:
            chord.chord,

          baseChord:
            chord.baseChord
            ??
            null,

          bassNote:
            chord.bassNote
            ??
            null,

          confidence:
            chord.confidence
            ??
            null,

          regionalCorrection:
            chord.regionalCorrection
            ??
            false,

          reconstructionValidated:
            chord.reconstructionValidated
            ??
            false,

          reconstructionChanged:
            chord.reconstructionChanged
            ??
            false,

          reconstructionReason:
            chord.reconstructionReason
            ??
            null,

          reconstruction:
            chord.reconstruction
            ??
            null,

          reconstructionDiagnostics:
            chord.reconstructionDiagnostics
            ??
            null,

          boundaryDiagnostic:
            chord.boundaryDiagnostic
            ??
            null,

          boundaryEvents:
            chord.boundaryEvents
            ??
            null

        })
      ),

    bassTimeline:
      data.debug?.bassTimeline
      ??
      null,

    bassByChordRegion:
      data.debug?.bassByChordRegion
      ??
      null

  };


  return JSON.stringify(
    diagnostic,
    null,
    2
  );

}


/* =========================================
   COPIAR API COMPLETA
========================================= */

copyFullButton.addEventListener(
  "click",
  async () => {

    if(!lastApiResponse){

      showCopyFeedback(
        "Nenhuma resposta para copiar."
      );

      return;

    }


    try{

      await copyText(
        JSON.stringify(
          lastApiResponse,
          null,
          2
        )
      );


      const originalText =
        copyFullButton.textContent;


      copyFullButton.textContent =
        "Copiado ✓";


      showCopyFeedback(
        "API completa copiada."
      );


      setTimeout(
        () => {

          copyFullButton.textContent =
            originalText;

        },
        1600
      );

    }

    catch(error){

      showCopyFeedback(
        error.message
      );

    }

  }
);


/* =========================================
   COPIAR DIAGNÓSTICO
========================================= */

copyDiagnosticButton.addEventListener(
  "click",
  async () => {

    if(!lastApiResponse){

      showCopyFeedback(
        "Nenhuma resposta para copiar."
      );

      return;

    }


    try{

      const diagnosticText =
        buildDiagnosticCopy(
          lastApiResponse
        );


      await copyText(
        diagnosticText
      );


      const originalText =
        copyDiagnosticButton.textContent;


      copyDiagnosticButton.textContent =
        "Copiado ✓";


      showCopyFeedback(
        "Diagnóstico copiado."
      );


      setTimeout(
        () => {

          copyDiagnosticButton.textContent =
            originalText;

        },
        1600
      );

    }

    catch(error){

      showCopyFeedback(
        error.message
      );

    }

  }
);


/* =========================================
   ANALISAR WAV
========================================= */

button.addEventListener(
  "click",
  async () => {

    const file =
      fileInput.files[0];


    if(!file){

      status.className =
        "status error";

      status.textContent =
        "Escolha um arquivo WAV.";

      return;

    }


    button.disabled =
      true;


    status.className =
      "status";

    status.textContent =
      "Enviando e analisando áudio...";


    result.style.display =
      "none";

    debugCard.style.display =
      "none";


    copyFeedback.textContent =
      "";


    lastApiResponse =
      null;


    try{

      const response =
        await fetch(
          API + "/analyze-wav",
          {

            method:
              "POST",

            headers:{

              "Content-Type":
                "audio/wav"

            },

            body:
              file

          }
        );


      const data =
        await response.json();


      /* =====================================
         GUARDA A RESPOSTA PARA OS BOTÕES
      ===================================== */

      lastApiResponse =
        data;


      debug.textContent =
        JSON.stringify(
          data,
          null,
          2
        );


      debugCard.style.display =
        "block";


      if(
        !response.ok
        ||
        !data.success
      ){

        throw new Error(
          data.message
          ||
          data.error
          ||
          "Falha na análise"
        );

      }


      status.className =
        "status success";

      status.textContent =
        "Análise concluída.";


      audioInfo.innerHTML =
        `
          <p>
            <strong>Duração:</strong>
            ${data.audio.duration}s
          </p>

          <p>
            <strong>Sample rate:</strong>
            ${data.audio.sampleRate} Hz
          </p>

          <p>
            <strong>Frames:</strong>
            ${data.audio.frameCount}
          </p>

          <p>
            <strong>Acordes detectados:</strong>
            ${data.chordCount}
          </p>
        `;


      chordsContainer.innerHTML =
        "";


      if(
        !data.chords
        ||
        data.chords.length === 0
      ){

        chordsContainer.innerHTML =
          `
            <p>
              Nenhum acorde detectado.
            </p>
          `;

      }

      else{

        for(
          const chord
          of data.chords
        ){

          const element =
            document.createElement(
              "div"
            );


          element.className =
            "chord";


          element.innerHTML =
            `
              <div class="chord-name">
                ${chord.chord}
              </div>

              <div class="time">
                ${Number(
                  chord.start
                ).toFixed(2)}s
                →
                ${Number(
                  chord.end
                ).toFixed(2)}s
              </div>

              <div class="confidence">
                Confiança:
                ${Math.round(
                  Number(
                    chord.confidence
                    ||
                    0
                  )
                  *
                  100
                )}%
              </div>
            `;


          chordsContainer.appendChild(
            element
          );

        }

      }


      result.style.display =
        "block";

    }

    catch(error){

      status.className =
        "status error";

      status.textContent =
        error.message;

    }

    finally{

      button.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
