<script>

const API =
  "https://chord-ai-api.onrender.com";


const fileInput =
  document.getElementById("file");

const analyzeButton =
  document.getElementById("analyze");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const audioInfo =
  document.getElementById("audioInfo");

const chordsContainer =
  document.getElementById("chords");

const debugCard =
  document.getElementById("debugCard");

const debug =
  document.getElementById("debug");

const playPreviewButton =
  document.getElementById("playPreview");

const stopPreviewButton =
  document.getElementById("stopPreview");

const previewStatus =
  document.getElementById("previewStatus");

const reviewBar =
  document.getElementById("reviewBar");

const reviewInfo =
  document.getElementById("reviewInfo");

const resetReviewButton =
  document.getElementById("resetReview");


let lastApiResponse =
  null;

let originalAnalysis =
  null;

let workingAnalysis =
  null;

let humanReview =
  new Map();


let previewContext =
  null;

let previewNodes =
  [];

let previewTimer =
  null;


const NOTE_TO_SEMITONE = {

  C:0,
  "C#":1,
  D:2,
  "D#":3,
  E:4,
  F:5,
  "F#":6,
  G:7,
  "G#":8,
  A:9,
  "A#":10,
  B:11

};


/* =========================================
   CLONE
========================================= */

function deepClone(
  value
){

  if(
    value === null
    ||
    value === undefined
  ){

    return value;

  }


  if(
    typeof structuredClone ===
    "function"
  ){

    return structuredClone(
      value
    );

  }


  return JSON.parse(
    JSON.stringify(
      value
    )
  );

}


/* =========================================
   REGION KEY
========================================= */

function regionKey(
  chord
){

  return (
    Number(
      chord.start
    ).toFixed(6)
    +
    "::"
    +
    Number(
      chord.end
    ).toFixed(6)
  );

}


/* =========================================
   BASE CHORD
========================================= */

function getBaseChord(
  chord
){

  if(
    chord.baseChord
  ){

    return chord.baseChord;

  }


  if(
    typeof chord.chord ===
    "string"
  ){

    return chord.chord
      .split("/")[0];

  }


  return null;

}


/* =========================================
   NOVO:
   MERGE DA TIMELINE REVISADA

   Une apenas segmentos adjacentes
   realmente equivalentes após revisão.

   Exemplo:

   Fmaj7 9.8 → 10.0
   Fmaj7 10.0 → 12.4

   vira:

   Fmaj7 9.8 → 12.4
========================================= */

function mergeReviewedTimeline(){

  if(
    !workingAnalysis
    ||
    !Array.isArray(
      workingAnalysis.chords
    )
  ){

    return;

  }


  const source =
    workingAnalysis.chords;


  if(
    source.length <= 1
  ){

    workingAnalysis.chordCount =
      source.length;

    return;

  }


  const merged =
    [];


  const EPSILON =
    0.001;


  for(
    const current
    of source
  ){

    if(
      merged.length === 0
    ){

      merged.push(
        deepClone(
          current
        )
      );

      continue;

    }


    const previous =
      merged[
        merged.length - 1
      ];


    const sameChord =
      previous.chord ===
      current.chord;


    const touching =
      Math.abs(
        Number(
          previous.end
        )
        -
        Number(
          current.start
        )
      )
      <=
      EPSILON;


    if(
      !sameChord
      ||
      !touching
    ){

      merged.push(
        deepClone(
          current
        )
      );

      continue;

    }


    /*
      Unimos o intervalo.
    */

    previous.end =
      current.end;


    /*
      Preserva o maior confidence original.

      Não criamos uma confiança falsa.
    */

    previous.confidence =
      Math.max(
        Number(
          previous.confidence
          ||
          0
        ),
        Number(
          current.confidence
          ||
          0
        )
      );


    /*
      Se qualquer parte foi revisada,
      o segmento inteiro fica marcado
      como revisado.
    */

    previous.humanReviewed =
      Boolean(
        previous.humanReviewed
        ||
        current.humanReviewed
      );


    /*
      Histórico de merge.
    */

    if(
      !Array.isArray(
        previous.humanMergeEvents
      )
    ){

      previous.humanMergeEvents =
        [];

    }


    previous.humanMergeEvents.push({

      mergedChord:
        current.chord,

      originalStart:
        current.start,

      originalEnd:
        current.end,

      reason:
        "adjacent-equal-after-human-review"

    });


    /*
      Une rejectedCandidates.
    */

    const previousRejected =
      previous.humanReview
      ?.rejectedCandidates
      ??
      [];


    const currentRejected =
      current.humanReview
      ?.rejectedCandidates
      ??
      [];


    const rejected =
      [
        ...new Set([
          ...previousRejected,
          ...currentRejected
        ])
      ];


    if(
      rejected.length > 0
    ){

      previous.humanReview =
        {

          ...(
            previous.humanReview
            ||
            current.humanReview
            ||
            {}
          ),

          rejectedCandidates:
            rejected,

          merged:
            true

        };

    }

  }


  workingAnalysis.chords =
    merged;


  workingAnalysis.chordCount =
    merged.length;

}


/* =========================================
   FREQUENCY
========================================= */

function noteFrequency(
  note,
  octave = 4
){

  const semitone =
    NOTE_TO_SEMITONE[
      note
    ];


  if(
    semitone === undefined
  ){

    return null;

  }


  const midi =
    12
    *
    (
      octave + 1
    )
    +
    semitone;


  return (
    440
    *
    Math.pow(
      2,
      (
        midi - 69
      )
      /
      12
    )
  );

}


/* =========================================
   STOP PREVIEW
========================================= */

function stopPreview(){

  if(
    previewTimer
  ){

    clearTimeout(
      previewTimer
    );

    previewTimer =
      null;

  }


  for(
    const node
    of previewNodes
  ){

    try{

      node.stop();

    }

    catch{}

  }


  previewNodes =
    [];


  if(
    previewContext
  ){

    try{

      previewContext.close();

    }

    catch{}

  }


  previewContext =
    null;


  previewStatus.textContent =
    "";

}


/* =========================================
   SCHEDULE TONE
========================================= */

function scheduleTone(
  context,
  frequency,
  start,
  duration,
  volume
){

  if(!frequency)
    return;


  const oscillator =
    context.createOscillator();


  const gain =
    context.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.value =
    frequency;


  oscillator.connect(
    gain
  );


  gain.connect(
    context.destination
  );


  const attack =
    Math.min(
      0.06,
      duration * 0.15
    );


  const release =
    Math.min(
      0.15,
      duration * 0.25
    );


  gain.gain.setValueAtTime(
    0.0001,
    start
  );


  gain.gain.exponentialRampToValueAtTime(
    Math.max(
      0.001,
      volume
    ),
    start + attack
  );


  const releaseStart =
    Math.max(
      start + attack,
      start + duration - release
    );


  gain.gain.setValueAtTime(
    Math.max(
      0.001,
      volume
    ),
    releaseStart
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );


  oscillator.start(
    start
  );


  oscillator.stop(
    start + duration + 0.02
  );


  previewNodes.push(
    oscillator
  );

}


/* =========================================
   PLAY PREVIEW
========================================= */

async function playPreview(){

  if(
    !workingAnalysis
    ||
    !Array.isArray(
      workingAnalysis.chords
    )
    ||
    workingAnalysis.chords.length === 0
  ){

    previewStatus.textContent =
      "Nenhuma análise disponível.";

    return;

  }


  stopPreview();


  const AudioContextClass =
    window.AudioContext
    ||
    window.webkitAudioContext;


  if(!AudioContextClass){

    previewStatus.textContent =
      "Web Audio API não suportada.";

    return;

  }


  previewContext =
    new AudioContextClass();


  await previewContext.resume();


  const context =
    previewContext;


  const now =
    context.currentTime
    +
    0.08;


  const timelineStart =
    Number(
      workingAnalysis.chords[0].start
    );


  let finalEnd =
    timelineStart;


  for(
    const chord
    of workingAnalysis.chords
  ){

    const chordStart =
      Number(
        chord.start
      );


    const chordEnd =
      Number(
        chord.end
      );


    const duration =
      Math.max(
        0.05,
        chordEnd - chordStart
      );


    const start =
      now
      +
      (
        chordStart
        -
        timelineStart
      );


    finalEnd =
      Math.max(
        finalEnd,
        chordEnd
      );


    const notes =
      Array.isArray(
        chord.notes
      )
      ?
      chord.notes
      :
      [];


    notes.forEach(
      (
        note,
        index
      ) => {

        const octave =
          index >= 3
          ?
          5
          :
          4;


        scheduleTone(
          context,
          noteFrequency(
            note,
            octave
          ),
          start,
          duration,
          0.055
        );

      }
    );


    if(
      chord.bassNote
      &&
      NOTE_TO_SEMITONE[
        chord.bassNote
      ]
      !== undefined
    ){

      scheduleTone(
        context,
        noteFrequency(
          chord.bassNote,
          2
        ),
        start,
        duration,
        0.075
      );

    }

  }


  previewStatus.textContent =
    humanReview.size > 0
    ?
    "Tocando reconstrução revisada..."
    :
    "Tocando reconstrução original...";


  const totalDuration =
    finalEnd
    -
    timelineStart;


  previewTimer =
    setTimeout(
      () => {

        if(
          previewContext ===
          context
        ){

          stopPreview();

        }

      },
      (
        totalDuration
        +
        0.35
      )
      *
      1000
    );

}


playPreviewButton.addEventListener(
  "click",
  playPreview
);


stopPreviewButton.addEventListener(
  "click",
  stopPreview
);


/* =========================================
   COPY
========================================= */

async function copyText(
  text
){

  if(
    navigator.clipboard
    &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(
      text
    );

    return;

  }


  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();


  const success =
    document.execCommand(
      "copy"
    );


  document.body.removeChild(
    textarea
  );


  if(!success){

    throw new Error(
      "Não foi possível copiar."
    );

  }

}


/* =========================================
   COMPACT CANDIDATE
========================================= */

function compactCandidate(
  candidate
){

  if(!candidate)
    return null;


  return {

    chord:
      candidate.chord
      ??
      null,

    detectorRank:
      candidate.detectorRank
      ??
      null,

    detectorScore:
      candidate.detectorScore
      ??
      null,

    detectorGap:
      candidate.detectorGap
      ??
      null,

    detectorNorm:
      candidate.detectorNorm
      ??
      null,

    reconstructionScore:
      candidate.reconstructionScore
      ??
      null,

    coverage:
      candidate.coverage
      ??
      null,

    persistence:
      candidate.persistence
      ??
      null,

    bassCompatibility:
      candidate.bassCompatibility
      ??
      null,

    marginalGain:
      candidate.marginalGain
      ??
      null,

    complexityPenalty:
      candidate.complexityPenalty
      ??
      null,

    finalScore:
      candidate.finalScore
      ??
      null

  };

}


/* =========================================
   DEBUG
========================================= */

function buildChordDiagnostic(
  chord
){

  return JSON.stringify(
    {

      segment:{

        start:
          chord.start,

        end:
          chord.end,

        chord:
          chord.chord,

        baseChord:
          chord.baseChord,

        bassNote:
          chord.bassNote,

        confidence:
          chord.confidence

      },

      humanReviewed:
        chord.humanReviewed
        ??
        false,

      humanReview:
        chord.humanReview
        ??
        null,

      humanMergeEvents:
        chord.humanMergeEvents
        ??
        null,

      reconstruction:
        chord.reconstruction
        ??
        null,

      topCandidates:
        chord
          .reconstructionDiagnostics
          ?.topCandidates
          ?.slice(
            0,
            5
          )
          ?.map(
            compactCandidate
          )
        ??
        [],

      bassRootCandidates:
        chord
          .reconstructionDiagnostics
          ?.bassRootCandidates
          ?.slice(
            0,
            5
          )
          ?.map(
            compactCandidate
          )
        ??
        []

    },
    null,
    2
  );

}


/* =========================================
   CANDIDATES
========================================= */

function getAlternativeCandidates(
  chord
){

  const diagnostics =
    chord.reconstructionDiagnostics
    ||
    {};


  const top =
    diagnostics.topCandidates
    ||
    [];


  const bass =
    diagnostics.bassRootCandidates
    ||
    [];


  const preferBass =
    chord.reconstructionReason ===
    "contradiction-rescue"
    ||
    chord.humanReviewSourceReason ===
    "contradiction-rescue";


  const all =
    preferBass
    ?
    [
      ...bass,
      ...top
    ]
    :
    [
      ...top,
      ...bass
    ];


  const map =
    new Map();


  for(
    const candidate
    of all
  ){

    if(
      candidate
      &&
      candidate.chord
      &&
      !map.has(
        candidate.chord
      )
    ){

      map.set(
        candidate.chord,
        candidate
      );

    }

  }


  return [
    ...map.values()
  ];

}


/* =========================================
   TRY ANOTHER
========================================= */

function tryAnotherChord(
  chord
){

  const key =
    regionKey(
      chord
    );


  let review =
    humanReview.get(
      key
    );


  if(!review){

    review = {

      rejected:
        new Set(),

      history:
        []

    };


    humanReview.set(
      key,
      review
    );

  }


  const currentBase =
    getBaseChord(
      chord
    );


  review.rejected.add(
    currentBase
  );


  const candidates =
    getAlternativeCandidates(
      chord
    );


  const selected =
    candidates.find(
      candidate =>
        candidate.chord !==
        currentBase
        &&
        !review.rejected.has(
          candidate.chord
        )
    );


  if(!selected){

    return false;

  }


  const previous =
    chord.chord;


  chord.baseChord =
    selected.chord;


  chord.chord =
    selected.chord;


  chord.notes =
    selected.notes
    ||
    chord.notes;


  chord.humanReviewed =
    true;


  chord.humanReviewSourceReason =
    chord.humanReviewSourceReason
    ||
    chord.reconstructionReason;


  chord.humanReview = {

    rejectedCandidates:
      [
        ...review.rejected
      ],

    selectedCandidate:
      selected.chord,

    reconstructionScore:
      selected.reconstructionScore
      ??
      null,

    finalScore:
      selected.finalScore
      ??
      null

  };


  review.history.push({

    from:
      previous,

    to:
      selected.chord

  });


  return true;

}


/* =========================================
   REVIEW BAR
========================================= */

function updateReviewBar(){

  if(
    humanReview.size === 0
  ){

    reviewBar.classList.remove(
      "visible"
    );

    return;

  }


  reviewBar.classList.add(
    "visible"
  );


  reviewInfo.textContent =
    `${humanReview.size} região(ões) revisada(s).`;

}


/* =========================================
   RENDER
========================================= */

function renderChords(){

  const chords =
    workingAnalysis
      ?.chords
    ||
    [];


  chordsContainer.innerHTML =
    "";


  audioInfo.innerHTML =
    `
      <p>
        <strong>Duração:</strong>
        ${workingAnalysis.audio.duration}s
      </p>

      <p>
        <strong>Sample rate:</strong>
        ${workingAnalysis.audio.sampleRate} Hz
      </p>

      <p>
        <strong>Frames:</strong>
        ${workingAnalysis.audio.frameCount}
      </p>

      <p>
        <strong>Acordes detectados:</strong>
        ${chords.length}
      </p>
    `;


  for(
    const chord
    of chords
  ){

    const element =
      document.createElement(
        "div"
      );


    element.className =
      "chord";


    if(
      chord.humanReviewed
    ){

      element.classList.add(
        "reviewed"
      );

    }


    element.innerHTML =
      `
        <div class="chord-name-row">

          <div class="chord-name">
            ${chord.chord}
          </div>

          ${
            chord.humanReviewed
            ?
            `
              <span class="review-badge">
                revisado
              </span>
            `
            :
            ""
          }

        </div>

        <div class="time">

          ${Number(
            chord.start
          ).toFixed(2)}s

          →

          ${Number(
            chord.end
          ).toFixed(2)}s

        </div>

        <div class="confidence">

          Confiança original:

          ${Math.round(
            Number(
              chord.confidence
              ||
              0
            )
            *
            100
          )}%

        </div>

        <div class="chord-actions">

          <button
            class="chord-action chord-copy"
            type="button"
          >
            Copiar debug
          </button>

          <button
            class="chord-action chord-retry"
            type="button"
          >
            Tentar outra cifra
          </button>

        </div>
      `;


    const copyButton =
      element.querySelector(
        ".chord-copy"
      );


    const retryButton =
      element.querySelector(
        ".chord-retry"
      );


    copyButton.addEventListener(
      "click",
      async () => {

        await copyText(
          buildChordDiagnostic(
            chord
          )
        );


        copyButton.textContent =
          "Copiado ✓";


        setTimeout(
          () => {

            copyButton.textContent =
              "Copiar debug";

          },
          1300
        );

      }
    );


    retryButton.addEventListener(
      "click",
      () => {

        stopPreview();


        const success =
          tryAnotherChord(
            chord
          );


        if(!success){

          previewStatus.textContent =
            "Não há outra candidata disponível.";

          return;

        }


        /*
          NOVO PASSO:

          logo depois da revisão,
          normalizamos a timeline.
        */

        mergeReviewedTimeline();


        renderChords();


        updateReviewBar();


        previewStatus.textContent =
          "Cifra substituída e timeline mesclada. Ouça novamente.";

      }
    );


    chordsContainer.appendChild(
      element
    );

  }

}


/* =========================================
   RESET
========================================= */

resetReviewButton.addEventListener(
  "click",
  () => {

    stopPreview();


    humanReview =
      new Map();


    workingAnalysis =
      deepClone(
        originalAnalysis
      );


    renderChords();


    updateReviewBar();


    previewStatus.textContent =
      "Resultado original restaurado.";

  }
);


/* =========================================
   ANALYZE
========================================= */

analyzeButton.addEventListener(
  "click",
  async () => {

    const file =
      fileInput.files[0];


    if(!file){

      status.className =
        "status error";


      status.textContent =
        "Escolha um arquivo WAV.";

      return;

    }


    stopPreview();


    analyzeButton.disabled =
      true;


    status.textContent =
      "Analisando...";


    try{

      const response =
        await fetch(
          API + "/analyze-wav",
          {

            method:
              "POST",

            headers:{

              "Content-Type":
                "audio/wav"

            },

            body:
              file

          }
        );


      const data =
        await response.json();


      if(
        !response.ok
        ||
        !data.success
      ){

        throw new Error(
          data.message
          ||
          data.error
          ||
          "Falha na análise"
        );

      }


      lastApiResponse =
        data;


      originalAnalysis =
        deepClone(
          data
        );


      workingAnalysis =
        deepClone(
          data
        );


      humanReview =
        new Map();


      debug.textContent =
        JSON.stringify(
          data,
          null,
          2
        );


      debugCard.style.display =
        "block";


      result.style.display =
        "block";


      status.className =
        "status success";


      status.textContent =
        "Análise concluída.";


      renderChords();


      updateReviewBar();

    }

    catch(error){

      status.className =
        "status error";


      status.textContent =
        error.message;

    }

    finally{

      analyzeButton.disabled =
        false;

    }

  }
);


fileInput.addEventListener(
  "change",
  stopPreview
);

</script>

</body>
</html>
