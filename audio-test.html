<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Chord AI — Audio Test</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #07090d;
  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding: 24px;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

h1 {
  margin-bottom: 6px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  color: #8d96a5;
  margin-top: 0;
  margin-bottom: 30px;
}

.card {
  background: #10141b;

  border:
    1px solid #252c37;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 20px;
}

input[type="file"] {
  width: 100%;
  margin-bottom: 18px;
}

button {
  width: 100%;

  border: 0;

  border-radius: 14px;

  padding: 16px;

  font-size: 16px;
  font-weight: 700;

  background: #3578ff;
  color: white;

  cursor: pointer;

  transition:
    opacity .2s ease,
    transform .15s ease,
    background .2s ease;
}

button:active {
  transform: scale(.985);
}

button:disabled {
  opacity: .45;
  cursor: default;
}

.status {
  margin-top: 18px;
  color: #aab2c0;
}

.error {
  color: #ff6767;
}

.success {
  color: #6be89b;
}


/* =========================================
   PREVIEW
========================================= */

.preview-controls {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin: 18px 0 10px;
}

.preview-stop {
  background: #232a35;
}

.preview-status {
  margin-top: 8px;
  margin-bottom: 8px;

  font-size: 13px;

  color: #8d96a5;
}


/* =========================================
   ACORDES
========================================= */

.chord {
  padding: 16px 0;

  border-bottom:
    1px solid #242a34;

  transition:
    opacity .2s ease;
}

.chord:last-child {
  border-bottom: 0;
}

.chord-name {
  font-size: 22px;
  font-weight: 800;
}

.time {
  color: #8993a3;
  margin-top: 4px;
}

.confidence {
  color: #657083;
  font-size: 13px;
  margin-top: 4px;
}

.chord-actions {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 12px;
}

.chord-action {
  padding: 11px 10px;

  font-size: 13px;

  border-radius: 10px;
}

.chord-copy {
  background: #1a2230;

  border:
    1px solid #303a49;
}

.chord-copy.copied {
  background: #173525;
  border-color: #285d3f;

  color: #78e7a3;
}

.chord-wrong {
  background: #332027;

  border:
    1px solid #693540;
}

.chord-wrong.active {
  background: #672b39;
}

.chord.rejected {
  opacity: .62;
}

.chord.rejected .chord-name {
  text-decoration: line-through;
}


/* =========================================
   DEBUG
========================================= */

pre {
  white-space: pre-wrap;
  word-break: break-word;

  font-size: 12px;
  line-height: 1.45;

  color: #9ca6b7;

  max-height: 520px;

  overflow-y: auto;

  margin-bottom: 0;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 520px) {

  body {
    padding: 16px;
  }

  .card {
    padding: 17px;
  }

  .preview-controls {
    grid-template-columns: 1fr;
  }

  .chord-actions {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<div class="container">

  <h1>Chord AI</h1>

  <p class="subtitle">
    Teste do Audio Engine
  </p>


  <!-- =====================================
       UPLOAD
  ====================================== -->

  <div class="card">

    <input
      id="file"
      type="file"
      accept=".wav,audio/wav,audio/x-wav"
    >

    <button id="analyze">
      Analisar WAV
    </button>

    <div
      id="status"
      class="status"
    >
      Selecione um arquivo WAV.
    </div>

  </div>


  <!-- =====================================
       RESULTADO
  ====================================== -->

  <div
    id="result"
    class="card"
    style="display:none"
  >

    <h2>Resultado</h2>

    <div id="audioInfo"></div>


    <!-- =================================
         SYNTH PREVIEW
    ================================== -->

    <div class="preview-controls">

      <button
        id="playPreview"
        type="button"
      >
        Ouvir reconstrução
      </button>

      <button
        id="stopPreview"
        class="preview-stop"
        type="button"
      >
        Parar
      </button>

    </div>


    <div
      id="previewStatus"
      class="preview-status"
    ></div>


    <div id="chords"></div>

  </div>


  <!-- =====================================
       JSON COMPLETO
  ====================================== -->

  <div
    id="debugCard"
    class="card"
    style="display:none"
  >

    <h2>Resposta da API</h2>

    <pre id="debug"></pre>

  </div>

</div>


<script>

/* =========================================
   API
========================================= */

const API =
  "https://chord-ai-api.onrender.com";


/* =========================================
   ELEMENTOS
========================================= */

const fileInput =
  document.getElementById("file");

const analyzeButton =
  document.getElementById("analyze");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const audioInfo =
  document.getElementById("audioInfo");

const chordsContainer =
  document.getElementById("chords");

const debugCard =
  document.getElementById("debugCard");

const debug =
  document.getElementById("debug");

const playPreviewButton =
  document.getElementById(
    "playPreview"
  );

const stopPreviewButton =
  document.getElementById(
    "stopPreview"
  );

const previewStatus =
  document.getElementById(
    "previewStatus"
  );


/* =========================================
   ESTADO
========================================= */

let lastApiResponse =
  null;

let lastAnalysis =
  null;

let rejectedRegions =
  [];


/* =========================================
   SYNTH STATE
========================================= */

let previewContext =
  null;

let previewNodes =
  [];

let previewTimer =
  null;


/* =========================================
   NOTAS
========================================= */

const NOTE_TO_SEMITONE = {

  C:0,
  "C#":1,
  D:2,
  "D#":3,
  E:4,
  F:5,
  "F#":6,
  G:7,
  "G#":8,
  A:9,
  "A#":10,
  B:11

};


/* =========================================
   FREQUÊNCIA
========================================= */

function noteFrequency(
  note,
  octave = 4
){

  const semitone =
    NOTE_TO_SEMITONE[
      note
    ];


  if(
    semitone === undefined
  ){

    return null;

  }


  const midi =
    12
    *
    (
      octave + 1
    )
    +
    semitone;


  return (
    440
    *
    Math.pow(
      2,
      (
        midi - 69
      )
      /
      12
    )
  );

}


/* =========================================
   PARAR PREVIEW
========================================= */

function stopPreview(){

  if(
    previewTimer
  ){

    clearTimeout(
      previewTimer
    );

    previewTimer =
      null;

  }


  for(
    const node
    of previewNodes
  ){

    try{

      node.stop();

    }

    catch{}

  }


  previewNodes =
    [];


  if(
    previewContext
  ){

    try{

      previewContext.close();

    }

    catch{}

  }


  previewContext =
    null;


  previewStatus.textContent =
    "";

}


/* =========================================
   AGENDAR TOM
========================================= */

function scheduleTone(
  context,
  frequency,
  start,
  duration,
  volume
){

  if(!frequency)
    return;


  const oscillator =
    context.createOscillator();


  const gain =
    context.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.value =
    frequency;


  oscillator.connect(
    gain
  );


  gain.connect(
    context.destination
  );


  const attack =
    Math.min(
      0.06,
      duration * 0.15
    );


  const release =
    Math.min(
      0.15,
      duration * 0.25
    );


  gain.gain.setValueAtTime(
    0.0001,
    start
  );


  gain.gain.exponentialRampToValueAtTime(
    Math.max(
      0.001,
      volume
    ),
    start + attack
  );


  const releaseStart =
    Math.max(
      start + attack,
      start + duration - release
    );


  gain.gain.setValueAtTime(
    Math.max(
      0.001,
      volume
    ),
    releaseStart
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );


  oscillator.start(
    start
  );


  oscillator.stop(
    start + duration + 0.02
  );


  previewNodes.push(
    oscillator
  );

}


/* =========================================
   OUVIR RECONSTRUÇÃO
========================================= */

async function playPreview(){

  if(
    !lastAnalysis
    ||
    !Array.isArray(
      lastAnalysis.chords
    )
    ||
    lastAnalysis.chords.length === 0
  ){

    previewStatus.textContent =
      "Nenhuma análise disponível.";

    return;

  }


  stopPreview();


  const AudioContextClass =
    window.AudioContext
    ||
    window.webkitAudioContext;


  if(!AudioContextClass){

    previewStatus.textContent =
      "Web Audio API não suportada.";

    return;

  }


  previewContext =
    new AudioContextClass();


  await previewContext.resume();


  const context =
    previewContext;


  const now =
    context.currentTime
    +
    0.08;


  const timelineStart =
    Number(
      lastAnalysis.chords[0].start
    );


  let finalEnd =
    timelineStart;


  for(
    const chord
    of lastAnalysis.chords
  ){

    const chordStart =
      Number(
        chord.start
      );


    const chordEnd =
      Number(
        chord.end
      );


    if(
      !Number.isFinite(
        chordStart
      )
      ||
      !Number.isFinite(
        chordEnd
      )
    ){

      continue;

    }


    const duration =
      Math.max(
        0.05,
        chordEnd - chordStart
      );


    const start =
      now
      +
      (
        chordStart
        -
        timelineStart
      );


    finalEnd =
      Math.max(
        finalEnd,
        chordEnd
      );


    const notes =
      Array.isArray(
        chord.notes
      )
      ?
      chord.notes
      :
      [];


    /* =====================================
       VOZES DO ACORDE
    ===================================== */

    notes.forEach(
      (note,index) => {

        let octave =
          4;


        if(
          index >= 3
        ){

          octave =
            5;

        }


        scheduleTone(
          context,
          noteFrequency(
            note,
            octave
          ),
          start,
          duration,
          0.055
        );

      }
    );


    /* =====================================
       BAIXO
    ===================================== */

    if(
      chord.bassNote
      &&
      NOTE_TO_SEMITONE[
        chord.bassNote
      ]
      !==
      undefined
    ){

      scheduleTone(
        context,
        noteFrequency(
          chord.bassNote,
          2
        ),
        start,
        duration,
        0.075
      );

    }

  }


  previewStatus.textContent =
    "Tocando reconstrução...";


  const totalDuration =
    Math.max(
      0,
      finalEnd
      -
      timelineStart
    );


  previewTimer =
    setTimeout(
      () => {

        if(
          previewContext ===
          context
        ){

          stopPreview();

        }

      },
      (
        totalDuration
        +
        0.35
      )
      *
      1000
    );

}


/* =========================================
   BOTÕES PREVIEW
========================================= */

playPreviewButton.addEventListener(
  "click",
  playPreview
);


stopPreviewButton.addEventListener(
  "click",
  stopPreview
);


/* =========================================
   COPIAR TEXTO
========================================= */

async function copyText(
  text
){

  if(
    navigator.clipboard
    &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(
      text
    );

    return;

  }


  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";

  textarea.style.top =
    "0";


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();


  const success =
    document.execCommand(
      "copy"
    );


  document.body.removeChild(
    textarea
  );


  if(!success){

    throw new Error(
      "Não foi possível copiar."
    );

  }

}


/* =========================================
   COMPACTAR CANDIDATO
========================================= */

function compactCandidate(
  candidate
){

  if(!candidate)
    return null;


  return {

    chord:
      candidate.chord
      ??
      null,

    detectorRank:
      candidate.detectorRank
      ??
      null,

    detectorScore:
      candidate.detectorScore
      ??
      null,

    detectorGap:
      candidate.detectorGap
      ??
      null,

    detectorNorm:
      candidate.detectorNorm
      ??
      null,

    reconstructionScore:
      candidate.reconstructionScore
      ??
      null,

    coverage:
      candidate.coverage
      ??
      null,

    persistence:
      candidate.persistence
      ??
      null,

    bassCompatibility:
      candidate.bassCompatibility
      ??
      null,

    marginalGain:
      candidate.marginalGain
      ??
      null,

    complexityPenalty:
      candidate.complexityPenalty
      ??
      null,

    incompatibleBassPenalty:
      candidate.incompatibleBassPenalty
      ??
      null,

    finalScore:
      candidate.finalScore
      ??
      null,

    inDecisionShortlist:
      candidate.inDecisionShortlist
      ??
      null,

    shortlistStatus:
      candidate.shortlistStatus
      ??
      null

  };

}


/* =========================================
   DEBUG COMPACTO DO ACORDE
========================================= */

function buildChordDiagnostic(
  chord
){

  const diagnostics =
    chord.reconstructionDiagnostics
    ||
    {};


  const search =
    diagnostics.candidateSearch
    ||
    {};


  const topCandidates =
    Array.isArray(
      diagnostics.topCandidates
    )
    ?
    diagnostics.topCandidates
      .slice(0,5)
      .map(
        compactCandidate
      )
    :
    [];


  const bassRootCandidates =
    Array.isArray(
      diagnostics.bassRootCandidates
    )
    ?
    diagnostics.bassRootCandidates
      .slice(0,5)
      .map(
        compactCandidate
      )
    :
    [];


  const compact = {

    segment:{

      start:
        chord.start
        ??
        null,

      end:
        chord.end
        ??
        null,

      chord:
        chord.chord
        ??
        null,

      baseChord:
        chord.baseChord
        ??
        null,

      bassNote:
        chord.bassNote
        ??
        null,

      confidence:
        chord.confidence
        ??
        null

    },


    decision:{

      reconstructionValidated:
        chord.reconstructionValidated
        ??
        false,

      reconstructionChanged:
        chord.reconstructionChanged
        ??
        false,

      reconstructionReason:
        chord.reconstructionReason
        ??
        null,

      reconstructionBoundary:
        chord.reconstructionBoundary
        ??
        null

    },


    reconstruction:
      chord.reconstruction
      ??
      null,


    candidateSearch:{

      totalObserved:
        search.totalObserved
        ??
        null,

      expectedTemplateCount:
        search.expectedTemplateCount
        ??
        null,

      originalBase:
        search.originalBase
        ??
        null,

      originalDetectorRank:
        search.originalDetectorRank
        ??
        null,

      originalInTop256:
        search.originalInTop256
        ??
        null,

      originalInDecisionShortlist:
        search.originalInDecisionShortlist
        ??
        null,

      bassRoot:
        search.bassRoot
        ??
        null,

      bassRatio:
        search.bassRatio
        ??
        null,

      decisionShortlistCount:
        search.decisionShortlistCount
        ??
        null

    },


    topCandidates,

    bassRootCandidates

  };


  return JSON.stringify(
    compact,
    null,
    2
  );

}


/* =========================================
   COPIAR DEBUG DO ACORDE
========================================= */

async function copyChordDebug(
  chord,
  copyButton
){

  try{

    const text =
      buildChordDiagnostic(
        chord
      );


    await copyText(
      text
    );


    const oldText =
      copyButton.textContent;


    copyButton.textContent =
      "Copiado ✓";


    copyButton.classList.add(
      "copied"
    );


    setTimeout(
      () => {

        copyButton.textContent =
          oldText;


        copyButton.classList.remove(
          "copied"
        );

      },
      1500
    );

  }

  catch{

    const oldText =
      copyButton.textContent;


    copyButton.textContent =
      "Erro ao copiar";


    setTimeout(
      () => {

        copyButton.textContent =
          oldText;

      },
      1600
    );

  }

}


/* =========================================
   MARCAR / DESMARCAR COMO ERRADO
========================================= */

function toggleRejectedChord(
  chord,
  element,
  wrongButton
){

  const existingIndex =
    rejectedRegions.findIndex(
      item =>
        item.start ===
        chord.start
        &&
        item.end ===
        chord.end
        &&
        item.chord ===
        chord.chord
    );


  if(
    existingIndex >= 0
  ){

    rejectedRegions.splice(
      existingIndex,
      1
    );


    element.classList.remove(
      "rejected"
    );


    wrongButton.classList.remove(
      "active"
    );


    wrongButton.textContent =
      "Marcar como errado";


    console.log(
      "Acordes rejeitados:",
      rejectedRegions
    );


    return;

  }


  rejectedRegions.push({

    start:
      chord.start,

    end:
      chord.end,

    chord:
      chord.chord

  });


  element.classList.add(
    "rejected"
  );


  wrongButton.classList.add(
    "active"
  );


  wrongButton.textContent =
    "Marcado como errado ✓";


  console.log(
    "Acordes rejeitados:",
    rejectedRegions
  );

}


/* =========================================
   RENDERIZAR ACORDES
========================================= */

function renderChords(
  chords
){

  chordsContainer.innerHTML =
    "";


  if(
    !Array.isArray(chords)
    ||
    chords.length === 0
  ){

    chordsContainer.innerHTML =
      `
        <p>
          Nenhum acorde detectado.
        </p>
      `;

    return;

  }


  for(
    const chord
    of chords
  ){

    const element =
      document.createElement(
        "div"
      );


    element.className =
      "chord";


    element.innerHTML =
      `
        <div class="chord-name">
          ${chord.chord}
        </div>

        <div class="time">
          ${Number(
            chord.start
          ).toFixed(2)}s
          →
          ${Number(
            chord.end
          ).toFixed(2)}s
        </div>

        <div class="confidence">
          Confiança:
          ${Math.round(
            Number(
              chord.confidence
              ||
              0
            )
            *
            100
          )}%
        </div>

        <div class="chord-actions">

          <button
            class="
              chord-action
              chord-copy
            "
            type="button"
          >
            Copiar debug
          </button>

          <button
            class="
              chord-action
              chord-wrong
            "
            type="button"
          >
            Marcar como errado
          </button>

        </div>
      `;


    const copyButton =
      element.querySelector(
        ".chord-copy"
      );


    const wrongButton =
      element.querySelector(
        ".chord-wrong"
      );


    copyButton.addEventListener(
      "click",
      () => {

        copyChordDebug(
          chord,
          copyButton
        );

      }
    );


    wrongButton.addEventListener(
      "click",
      () => {

        toggleRejectedChord(
          chord,
          element,
          wrongButton
        );

      }
    );


    chordsContainer.appendChild(
      element
    );

  }

}


/* =========================================
   ANALISAR WAV
========================================= */

analyzeButton.addEventListener(
  "click",
  async () => {

    const file =
      fileInput.files[0];


    if(!file){

      status.className =
        "status error";

      status.textContent =
        "Escolha um arquivo WAV.";

      return;

    }


    stopPreview();


    analyzeButton.disabled =
      true;


    status.className =
      "status";


    status.textContent =
      "Enviando e analisando áudio...";


    result.style.display =
      "none";


    debugCard.style.display =
      "none";


    lastApiResponse =
      null;


    lastAnalysis =
      null;


    rejectedRegions =
      [];


    try{

      const response =
        await fetch(
          API + "/analyze-wav",
          {

            method:
              "POST",

            headers:{

              "Content-Type":
                "audio/wav"

            },

            body:
              file

          }
        );


      const data =
        await response.json();


      /* =====================================
         SALVA RESULTADO
      ===================================== */

      lastApiResponse =
        data;


      lastAnalysis =
        data;


      /* =====================================
         JSON COMPLETO
      ===================================== */

      debug.textContent =
        JSON.stringify(
          data,
          null,
          2
        );


      debugCard.style.display =
        "block";


      if(
        !response.ok
        ||
        !data.success
      ){

        throw new Error(
          data.message
          ||
          data.error
          ||
          "Falha na análise"
        );

      }


      status.className =
        "status success";


      status.textContent =
        "Análise concluída.";


      /* =====================================
         INFO
      ===================================== */

      audioInfo.innerHTML =
        `
          <p>
            <strong>Duração:</strong>
            ${data.audio.duration}s
          </p>

          <p>
            <strong>Sample rate:</strong>
            ${data.audio.sampleRate} Hz
          </p>

          <p>
            <strong>Frames:</strong>
            ${data.audio.frameCount}
          </p>

          <p>
            <strong>Acordes detectados:</strong>
            ${data.chordCount}
          </p>
        `;


      /* =====================================
         ACORDES
      ===================================== */

      renderChords(
        data.chords
      );


      result.style.display =
        "block";

    }

    catch(error){

      status.className =
        "status error";


      status.textContent =
        error.message;

    }

    finally{

      analyzeButton.disabled =
        false;

    }

  }
);


/* =========================================
   SE TROCAR O WAV, PARA A PREVIEW
========================================= */

fileInput.addEventListener(
  "change",
  () => {

    stopPreview();

  }
);

</script>
